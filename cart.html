<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>העגלה — פונטיאדה</title>
<!--
  פונטיאדה — עגלה + צ'קאאוט (פרוטוטייפ)
  פיצ'רים: פריטים בפונט שלהם, זיהוי חבילת בחרו-5 (₪149, עד 2 פרימיום),
  אפסייל "הוסיפו עוד X", טופס תשלום דמו עם checkbox אין-ביטולים (חובה משפטית),
  מסך הצלחה עם הורדות. עגלה נשמרת ב-localStorage.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#111111; --accent:#e8320f; --green:#0c7a43;
    --soft:#f4f2ee; --line:rgba(17,17,17,.15);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--soft);color:var(--ink);font-family:'Heebo',sans-serif;overflow-x:hidden;line-height:1.5}
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  header{position:fixed;inset-inline:0;top:0;z-index:90;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--ink)}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:18px 4vw}
  .nav .logo img{height:34px;width:auto}
  .nav-links{display:flex;gap:26px;font-size:15px;font-weight:500;align-items:center}
  .nav-cta{background:var(--ink);color:#fff;border:none;border-radius:0;padding:10px 22px;font-size:15px;font-weight:700;transition:.25s}
  .nav-cta:hover{background:var(--accent)}
  .nav-user{font-weight:700;font-size:15px}
  footer{display:flex;justify-content:space-between;align-items:center;padding:26px 4vw;font-size:13.5px;color:rgba(17,17,17,.55);border-top:1px solid var(--line);flex-wrap:wrap;gap:8px}
  footer .flinks{display:flex;gap:18px}

  .wrap{max-width:1200px;margin-inline:auto;padding:140px 5vw 90px}
  h1{font-size:clamp(38px,5.5vw,72px);font-weight:900;line-height:1.05}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{margin-top:8px;color:rgba(17,17,17,.55);font-size:16px}

  .cart-layout{display:grid;grid-template-columns:1fr minmax(300px,380px);gap:28px;margin-top:36px;align-items:start}
  @media (max-width:900px){ .cart-layout{grid-template-columns:1fr} }

  .items{display:flex;flex-direction:column;gap:14px}
  .item{display:flex;align-items:center;gap:18px;background:#fff;border:1.5px solid var(--ink);border-radius:0;padding:18px 22px}
  .item .swatch{width:86px;height:86px;border-radius:0;display:grid;place-items:center;font-size:40px;flex-shrink:0}
  .item .info{flex:1}
  .item .name{font-weight:900;font-size:19px}
  .item .tag{font-size:13.5px;color:rgba(17,17,17,.55)}
  .item .price{font-weight:900;font-size:20px}
  .item .rm{background:none;border:none;font-size:18px;color:rgba(17,17,17,.4);transition:.2s;padding:6px}
  .item .rm:hover{color:var(--accent);transform:scale(1.2)}

  .upsell{background:var(--soft);border:1.5px solid var(--ink);border-radius:0;padding:16px 20px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .upsell a{text-decoration:underline}
  .bundle-on{background:var(--green);color:#fff;border-color:var(--green)}

  .summary{position:sticky;top:100px;background:#fff;border:1.5px solid var(--ink);border-radius:0;padding:28px}
  .srow{display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px}
  .srow.total{font-size:22px;font-weight:900;border-top:1.5px solid var(--line);padding-top:14px;margin-top:14px}
  .srow .strike{text-decoration:line-through;color:rgba(17,17,17,.4);margin-inline-end:8px}
  .saved{color:var(--accent);font-weight:700;font-size:14px}

  .field{margin-top:14px}
  .field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px}
  .field input{width:100%;border:1.5px solid var(--ink);background:var(--soft);border-radius:0;padding:12px 16px;font-size:15px;font-family:inherit;outline:none;transition:.2s}
  .field input:focus{border-color:var(--ink)}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13px;line-height:1.55;color:rgba(17,17,17,.75)}
  .consent input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}
  .consent a{text-decoration:underline}
  .btn-pay{width:100%;margin-top:18px;background:var(--ink);color:#fff;font-size:18px;font-weight:900;border:none;border-radius:0;padding:17px;transition:.25s}
  .btn-pay:hover:not(:disabled){background:var(--accent);transform:translateY(-2px)}
  .btn-pay:disabled{opacity:.45;cursor:not-allowed}
  .secure{margin-top:12px;text-align:center;font-size:12.5px;color:rgba(17,17,17,.45)}

  /* עגלה ריקה */
  .empty{text-align:center;padding:60px 0}
  .empty .big{font-size:clamp(30px,4vw,52px);font-weight:900;line-height:1.2}
  .empty p{margin-top:12px;color:rgba(17,17,17,.55)}
  .btn-big{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;border:none;border-radius:0;padding:16px 34px;transition:.25s;margin-top:26px}
  .btn-big:hover{background:var(--accent);transform:translateY(-3px)}

  /* מסך הצלחה */
  .success{display:none;text-align:center;padding:40px 0}
  .success .emoji{font-size:70px}
  .success h2{font-size:clamp(34px,4.6vw,60px);font-weight:900;margin-top:10px}
  .success p{margin-top:10px;color:rgba(17,17,17,.6);font-size:17px}
  .dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:760px;margin:34px auto 0}
  .dl-card{background:#fff;border:1.5px solid var(--ink);border-radius:0;padding:20px;text-align:center}
  .dl-card .fname{font-size:34px;line-height:1.2}
  .dl-card .dl{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;border-radius:0;padding:9px 20px;font-size:13.5px;font-weight:700;transition:.2s}
  .dl-card .dl:hover{background:var(--accent)}
</style>
</head>
<body>

<header><div id="site-header"></div></header>

<div class="wrap">
  <!-- מצב עגלה -->
  <div id="cartView">
    <h1>העגלה <em>שלכם.</em></h1>
    <div class="sub">רישיון אוניברסלי לכל פונט · כל המחירים כוללים מע״מ</div>

    <div class="cart-layout" id="cartLayout">
      <div>
        <div class="items" id="items"></div>
        <div style="height:14px"></div>
        <div id="upsell"></div>
      </div>

      <aside class="summary">
        <div id="srows"></div>

        <div class="field">
          <label for="fName">שם מלא</label>
          <input id="fName" type="text" placeholder="ישראל ישראלי">
        </div>
        <div class="field">
          <label for="fEmail">אימייל (לשם נשלחים הקבצים)</label>
          <input id="fEmail" type="email" placeholder="you@example.com">
        </div>

        <div class="consent">
          <input type="checkbox" id="consent">
          <label for="consent">אני מאשר/ת שהפונטים נמסרים בהורדה מיידית, ולכן <b>לא ניתן לבטל את העסקה</b> לאחר השלמתה, בהתאם ל<a href="license.html">תנאי הרישיון ומדיניות הרכישה</a>.</label>
        </div>

        <button class="btn-pay" id="payBtn" disabled>לתשלום מאובטח ←</button>
        <div class="secure">🔒 דמו — התשלום האמיתי יעבור דרך Stripe</div>
      </aside>
    </div>

    <!-- עגלה ריקה -->
    <div class="empty" id="emptyView" style="display:none">
      <div class="big">העגלה ריקה. הפונטים מחכים.</div>
      <p>33 פונטים עבריים, החל מ-₪39 כולל הכל.</p>
      <button class="btn-big" onclick="location.href='catalog.html'">לקטלוג ←</button>
    </div>
  </div>

  <!-- מסך הצלחה -->
  <div class="success" id="successView">
    <div class="emoji">🎉</div>
    <h2>זהו, הפונטים שלכם. לתמיד.</h2>
    <p>שלחנו אישור למייל. אפשר להוריד כאן עכשיו — ותמיד שוב מהאיזור האישי.<br>עכשיו לכו תעשו איתם משהו יפה.</p>
    <div class="dl-grid" id="dlGrid"></div>
    <button class="btn-big" onclick="location.href='catalog.html'">חזרה לקטלוג ←</button>
  </div>
</div>

<div id="site-footer"></div>

<script src="shared.js"></script>
<script>
renderHeader(); renderFooter();

const itemsEl = document.getElementById('items');
const upsellEl = document.getElementById('upsell');
const srowsEl = document.getElementById('srows');
const payBtn = document.getElementById('payBtn');
const consent = document.getElementById('consent');

function render(){
  const slugs = Cart.get();
  const has = slugs.length > 0;
  document.getElementById('cartLayout').style.display = has ? '' : 'none';
  document.getElementById('emptyView').style.display = has ? 'none' : '';
  if (!has) return;

  itemsEl.innerHTML = '';
  slugs.forEach(slug => {
    const f = fontBySlug(slug); if (!f) return;
    const i = FONTS.indexOf(f);
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `
      <div class="swatch" style="background:${cardColor(i)};font-family:'${f.slug}'">${f.he.slice(0,2)}</div>
      <div class="info">
        <div class="name">${f.he} ${f.tier===59 ? '· פרימיום' : ''}</div>
        <div class="tag">${f.tag} · משפחה מלאה · כל השימושים</div>
      </div>
      <div class="price">₪${f.tier}</div>
      <button class="rm" title="הסרה" aria-label="הסירו את ${f.he}">✕</button>`;
    d.querySelector('.rm').onclick = () => { Cart.remove(slug); render(); };
    itemsEl.appendChild(d);
  });

  /* אפסייל / חבילה */
  const p = Cart.pricing();
  const n = slugs.length;
  const premiums = slugs.map(fontBySlug).filter(f => f && f.tier===59).length;
  if (p.bundle) {
    upsellEl.innerHTML = `<div class="upsell bundle-on">🎁 חבילת בחרו-5 הופעלה! 5 פונטים ב-₪149 — חסכתם ₪${p.saved}.</div>`;
  } else if (n >= 2 && n < 5) {
    upsellEl.innerHTML = `<div class="upsell">💡 עוד ${5-n} פונטים ואתם בחבילת בחרו-5: כל החמישה ב-₪149. <a href="catalog.html">להשלמת החבילה ←</a></div>`;
  } else if (n === 5 && premiums > 2) {
    upsellEl.innerHTML = `<div class="upsell">חבילת בחרו-5 מוגבלת ל-2 פרימיום (יש לכם ${premiums}) — המחיר חושב רגיל.</div>`;
  } else {
    upsellEl.innerHTML = '';
  }

  /* סיכום */
  const regular = slugs.map(fontBySlug).filter(Boolean).reduce((a,f)=>a+f.tier,0);
  srowsEl.innerHTML = `
    <div class="srow"><span>${n} פונטים</span><span>${p.bundle ? '<span class="strike">₪'+regular+'</span>' : ''}₪${p.total}</span></div>
    ${p.bundle ? `<div class="srow saved"><span>חבילת בחרו-5</span><span>−₪${p.saved}</span></div>` : ''}
    <div class="srow"><span>הפונטים החינמיים שלנו</span><span>מצורפים 🎁</span></div>
    <div class="srow total"><span>לתשלום</span><span>₪${p.total}</span></div>`;
}

consent.addEventListener('change', () => payBtn.disabled = !consent.checked);

payBtn.addEventListener('click', () => {
  const name = document.getElementById('fName').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  if (!name || !email.includes('@')) { toast('רגע — חסרים שם ומייל תקין'); return; }
  if (!consent.checked) return;
  const slugs = Cart.get();
  const p = Cart.pricing();
  User.addPurchase(slugs, p.total);
  if (!User.get()) User.set({ name, email });

  /* מסך הצלחה */
  document.getElementById('cartView').style.display = 'none';
  const dl = document.getElementById('dlGrid');
  dl.innerHTML = '';
  slugs.forEach(slug => {
    const f = fontBySlug(slug); if (!f) return;
    const i = FONTS.indexOf(f);
    const c = document.createElement('div');
    c.className = 'dl-card';
    c.style.background = cardColor(i);
    c.innerHTML = `<div class="fname" style="font-family:'${f.slug}'">${f.he}</div>
                   <a class="dl" href="fonts/${f.slug}.woff2" download>הורדה (דמו) ↓</a>`;
    dl.appendChild(c);
  });
  Cart.clear();
  document.getElementById('successView').style.display = 'block';
  window.scrollTo(0, 0);
});

render();
</script>
</body>
</html>
